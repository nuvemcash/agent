image:
  repository: ghcr.io/nuvemcash/agent
  tag: ""            # default: appVersion do chart; se definido, vence o digest
  # Digest da imagem multi-arch, gravado pelo release antes do helm package: a assinatura
  # do chart passa a cobrir a imagem. Vazio no repositório (sem digest, vale a tag).
  digest: ""
  pullPolicy: IfNotPresent

connection:
  # Token de conexão do cluster (exibido uma única vez na tela do nuvem.cash).
  token: ""
  # Alternativa ao --set token: Secret existente com a chave "token".
  existingSecret: ""
  url: "https://ingest.nuvem.cash"

# Intervalos de coleta/envio (defaults da spec; só mexa se souber por quê).
scrapeInterval: "60s"
shipInterval: "5m"

# Logs no stderr. json (padrão) para pipelines de log; text para ler direto no kubectl logs.
logging:
  format: json
  level: info   # debug, info, warn ou error

# Probes. O startupProbe cobre a partida — sincronizar os caches do informer leva de
# segundos a alguns minutos conforme o tamanho do cluster — e só depois que ele passa é
# que liveness e readiness começam a valer. Os timeouts são folgados de propósito: num nó
# sob pressão o próprio kubelet demora a executar a probe, e o default de 1s derruba um
# agente saudável.
probes:
  startup:
    periodSeconds: 5
    failureThreshold: 60      # até 5min para sincronizar
    timeoutSeconds: 3
  liveness:
    periodSeconds: 30
    failureThreshold: 4
    timeoutSeconds: 5
  readiness:
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

# Atualização automática (ADR 0017): um CronJob de hora em hora pergunta ao nuvem.cash a
# versão alvo deste cluster e aplica o chart inteiro dela, por digest, com identidade
# própria. O teto de permissões dessa identidade (templates/updater.yaml) é o máximo que
# uma atualização consegue conceder ao agente: versão que pede mais é recusada pelo
# próprio Kubernetes e fica para um upgrade manual, com o seu consentimento.
autoUpgrade:
  # false: o chart não renderiza o CronJob nem as permissões do updater.
  enabled: true
  # Repositório OCI do chart, sem tag (o alvo vem com digest).
  chart: oci://ghcr.io/nuvemcash/charts/nuvemcash-agent
  # Só para registry local de teste, sem TLS.
  plainHTTP: false
  # Espera de readiness do upgrade e, se ele falhar, a do rollback. As duas somadas têm de
  # caber nos 15 minutos de uma execução: não passe de 6m.
  timeout: 5m

podLabels: {}
nodeSelector: {}
tolerations: []

# Integração com o monitoramento local; nenhuma stack é instalada pelo chart.
monitoring:
  # Vazio preserva o cluster definido pelo coletor; avaliação sem esse label é local.
  # Antes de federar, configure uma identidade única aqui ou no coletor.
  cluster: ""
  environment: local
  metrics:
    enabled: true
  podMonitor:
    enabled: true
    labels: {}
    # MatchLabels adicionais (presentes em podLabels), combinados à identidade fixa da release.
    selector: {}
    interval: 30s
    scrapeTimeout: 10s
  alerts:
    enabled: true
    # Labels do recurso para a seleção pelo avaliador.
    labels: {}
    # Labels dos alertas; não substituem identidade, condição/severidade nem dimensões.
    # cluster, reason, status, installed_version e latest_version são reservados.
    additionalLabels: {}
    notificationMode: active
    failureSeconds: 600
    # Perda é ocorrência: o aviso expira, sem afirmar restauração do dado descartado.
    lossWindowSeconds: 600
    # Cadência informativa herdada; não representa SLA de atualização ou disponibilidade.
    outdatedFor: 72h
