{{- /*
  `helm upgrade --reuse-values` reaproveita os values computados do release ANTIGO e não
  traz os defaults do chart novo — quem vier de um release sem o bloco `probes` cairia num
  "nil pointer evaluating interface {}.startup". O required abaixo troca esse erro por uma
  instrução do que fazer.
*/}}
{{- $probes := .Values.probes | default dict }}
{{- $probeHint := "bloco `probes` ausente nos values: em upgrade de um release anterior a 0.2.2, troque --reuse-values por --reset-then-reuse-values" }}
{{- /* Sem o bloco `logging` (release anterior ao --reuse-values), vale o default do processo: json/info. */}}
{{- $logging := .Values.logging | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/name: nuvemcash-agent, app.kubernetes.io/instance: {{ .Release.Name | quote }}}
spec:
  replicas: 1
  # Rolling update sem indisponibilidade: o pod novo fica pronto antes de o antigo sair, e
  # o coletor nunca fica fora do ar na troca de versão (atualização automática, ADR 0017).
  #
  # Os dois pods convivem sem medir os mesmos segundos — e isso importa, porque o ingest
  # SOMA as janelas por hora e sobreposição contaria em dobro. O pod novo só conta a partir
  # do primeiro scrape, que acontece um scrapeInterval depois de os caches sincronizarem
  # (/readyz); o antigo para de raspar no SIGTERM, que chega logo depois de o Kubernetes
  # ver o novo pronto (até startup.periodSeconds + readiness.periodSeconds após o /readyz).
  # Não há dupla contagem enquanto scrapeInterval > startup.periodSeconds +
  # readiness.periodSeconds (default: 60s > 35s); o e2e (hack/e2e-kind.sh) confere isso
  # pelas janelas que chegam ao ingest. A troca perde no máximo um intervalo de scrape, que
  # vira "não monitorado"; Recreate foi descartado porque a lacuna dele (término + sincronização +
  # base) é maior.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: nuvemcash-agent}
  template:
    metadata:
      labels:
        {{- toYaml (mergeOverwrite (deepCopy .Values.podLabels) (dict "app.kubernetes.io/name" "nuvemcash-agent" "app.kubernetes.io/instance" .Release.Name)) | nindent 8 }}
      annotations:
        # Muda o hash quando o token rotaciona, forçando um rollout do Deployment no mesmo
        # `helm upgrade --set connection.token=<novo>` — sem isso, só o Secret seria
        # atualizado e o pod antigo continuaria rodando com o token velho em memória até
        # reiniciar por outro motivo. Com existingSecret, o rollout é responsabilidade do
        # operador (o agente não sabe quando o conteúdo do Secret externo muda).
        {{- if not .Values.connection.existingSecret }}
        checksum/token: {{ sha256sum .Values.connection.token }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: {{ include "nuvemcash-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NUVEMCASH_AGENT_METRICS_ENABLED
              value: {{ .Values.monitoring.metrics.enabled | quote }}
            - name: NUVEMCASH_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nuvemcash-agent.secretName" . }}
                  key: token
            - name: NUVEMCASH_AGENT_URL
              value: {{ .Values.connection.url | quote }}
            - name: NUVEMCASH_AGENT_SCRAPE_INTERVAL
              value: {{ .Values.scrapeInterval | quote }}
            - name: NUVEMCASH_AGENT_SHIP_INTERVAL
              value: {{ .Values.shipInterval | quote }}
            - name: NUVEMCASH_AGENT_LOG_FORMAT
              value: {{ $logging.format | default "json" | quote }}
            - name: NUVEMCASH_AGENT_LOG_LEVEL
              value: {{ $logging.level | default "info" | quote }}
            # Com o updater desligado não há CronJob: o coletor relata o desligamento à api.
            - name: NUVEMCASH_AGENT_AUTO_UPGRADE_ENABLED
              value: {{ (.Values.autoUpgrade | default dict).enabled | toString | quote }}
          ports:
            - {name: health, containerPort: 8080}
          # /healthz responde assim que o processo sobe; /readyz só depois que os caches
          # do informer sincronizam. O startupProbe segura liveness e readiness até lá.
          startupProbe:
            httpGet: {path: /readyz, port: health}
            {{- toYaml (required $probeHint $probes.startup) | nindent 12 }}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            {{- toYaml (required $probeHint $probes.liveness) | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            {{- toYaml (required $probeHint $probes.readiness) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
