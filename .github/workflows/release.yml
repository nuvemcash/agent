name: release
on:
  push:
    tags: ["v*"]
# O test roda código de dependências: fica sem packages:write e sem token OIDC.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - run: go test ./... -race -count=1
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # identidade OIDC do job, para a assinatura keyless (cosign/Sigstore)
    steps:
      - uses: actions/checkout@v7
      - name: Normaliza VERSION sem o prefixo v (casa com a tag semver e o chart)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/nuvemcash/agent
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: sigstore/cosign-installer@v4.1.2
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Assina a imagem pelo digest (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/nuvemcash/agent@${DIGEST}"
  chart:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # identidade OIDC do job, para a assinatura keyless (cosign/Sigstore)
    steps:
      - uses: actions/checkout@v7
      # Helm fixado: o do runner muda sem aviso, e o Helm 3 escreve o "Digest:" do push no
      # stderr, o 4 no stdout. O 2>&1 abaixo cobre os dois; a versão fixa evita a surpresa.
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: sigstore/cosign-installer@v4.1.2
      # O cosign publica a assinatura com as credenciais do docker, não as do helm.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publica o chart como OCI no GHCR e o assina pelo digest (cosign keyless)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/nuvemcash-agent --version "$VERSION" --app-version "$VERSION"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "nuvemcash-agent-${VERSION}.tgz" oci://ghcr.io/nuvemcash/charts 2>&1 | tee push.log
          DIGEST=$(awk '/^Digest:/ {print $2}' push.log)
          test -n "$DIGEST"
          cosign sign --yes "ghcr.io/nuvemcash/charts/nuvemcash-agent@${DIGEST}"
